name: Android

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  statuses: write

jobs:
  build:
    name: Test and assemble debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure SDK platform 35
        run: |
          set -x
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "sdk.dir=$SDK" > local.properties
          if [ -d "$SDK/platforms/android-35" ]; then
            echo "android-35 already installed"
          else
            yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" \
              "platforms;android-35" "build-tools;35.0.0" "platform-tools"
          fi
          ls "$SDK/platforms"

      - name: Unit tests
        run: |
          set -o pipefail
          ./gradlew --no-daemon --stacktrace --console=plain testDebugUnitTest 2>&1 | tee gradle-test.log

      - name: Assemble debug APK
        run: |
          set -o pipefail
          ./gradlew --no-daemon --stacktrace --console=plain assembleDebug 2>&1 | tee gradle-assemble.log

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: skyora-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish rolling APK release
        if: github.ref == 'refs/heads/main' && success()
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          NOTES=release-notes.md
          {
            echo "Installable **debug-signed** build of SKYORA, produced automatically from \`main\` (\`$GITHUB_SHA\`)."
            echo
            echo "- Android 8.0+ (API 26), package \`com.skyora.weather.debug\`"
            echo "- Weather data by [Open-Meteo.com](https://open-meteo.com/) (CC BY 4.0); geocoding CC BY-NC 4.0"
            echo "- The free Open-Meteo tier is for non-commercial use"
            echo "- Debug builds are meant for testing, not distribution"
          } > "$NOTES"
          if gh release view apk-latest >/dev/null 2>&1; then
            gh release upload apk-latest "$APK" --clobber
            gh release edit apk-latest --notes-file "$NOTES"
          else
            gh release create apk-latest "$APK" \
              --title "SKYORA - latest APK" \
              --notes-file "$NOTES" \
              --latest
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Publish test summary
        if: always()
        run: |
          python3 - <<'PY' > test-summary.md || echo "no test results" > test-summary.md
          import glob, xml.etree.ElementTree as ET
          tests = failures = errors = skipped = 0
          for f in glob.glob("app/build/test-results/testDebugUnitTest/*.xml"):
              r = ET.parse(f).getroot()
              tests += int(r.get("tests", 0)); failures += int(r.get("failures", 0))
              errors += int(r.get("errors", 0)); skipped += int(r.get("skipped", 0))
          passed = tests - failures - errors - skipped
          print(f"{passed} passed, {failures + errors} failed, {skipped} skipped ({tests} total)")
          PY
          cat test-summary.md >> "$GITHUB_STEP_SUMMARY"
          echo "**Unit tests:** $(cat test-summary.md)" >> "$GITHUB_STEP_SUMMARY"
          STATE=success
          grep -q "0 failed" test-summary.md || STATE=failure
          gh api "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="$STATE" -f context="unit-tests" \
            -f description="$(cat test-summary.md | cut -c1-140)" \
            -f target_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" > /dev/null || true
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            gradle-test.log
            gradle-assemble.log
            app/build/reports/tests/**
            app/build/test-results/**
          if-no-files-found: ignore

      - name: Publish failure summary
        if: failure()
        run: |
          LOG=$(ls gradle-assemble.log gradle-test.log 2>/dev/null | tail -n 1)
          {
            echo "## Build failed"
            echo '```'
            tail -n 120 "$LOG" 2>/dev/null || echo "no gradle log captured"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          # Surface compiler/test errors as annotations (readable through the API).
          grep -a -m 12 -E "^e: |error:|FAILED|Execution failed|Caused by:" "$LOG" 2>/dev/null \
            | sed -e 's/%/%25/g' -e 's/\r//g' -e 's/^/::error::/' || true

          PR="${{ github.event.pull_request.number }}"
          if [ -z "$PR" ]; then
            PR=$(gh pr list --head "${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}" --state open --json number -q '.[0].number' 2>/dev/null || true)
          fi
          if [ -n "$PR" ]; then
            {
              echo "Build failed for \`$GITHUB_SHA\`."
              echo '```'
              tail -n 120 "$LOG" 2>/dev/null || echo "no gradle log captured"
              echo '```'
            } > failure.txt
            gh pr comment "$PR" --body-file failure.txt
          fi
        env:
          GH_TOKEN: ${{ github.token }}
